<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12303B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Penghitung Dzikir</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%2312303B'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23E2B44D' stroke-width='8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAF1F4;
    --panel: #FFFFFF;
    --ink: #12303B;
    --muted: #55707B;
    --line: #C9D9DF;
    --accent: #1F6F78;
    --accent-soft: #D4E8EA;
    --gold: #C4922A;
    --on-accent: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1F26;
      --panel: #142A33;
      --ink: #EAF3F5;
      --muted: #93AEB8;
      --line: #274552;
      --accent: #4FB3BC;
      --accent-soft: #1B3B45;
      --gold: #E2B44D;
      --on-accent: #0D1F26;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  }
  .app { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }

  h1 { font-size: 1.05rem; font-weight: 800; margin: 4px 0 0; text-align: center; letter-spacing: .01em; }

  .tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    background: var(--accent-soft); padding: 4px; border-radius: 14px;
  }
  .tab {
    border: 0; background: transparent; color: var(--muted);
    font: inherit; font-weight: 700; font-size: .92rem;
    padding: 10px 8px; border-radius: 10px; cursor: pointer;
    display: flex; flex-direction: column; gap: 2px; align-items: center;
  }
  .tab small { font-weight: 600; font-size: .75rem; opacity: .85; }
  .tab[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(18,48,59,.18); }

  .card {
    background: var(--panel); border-radius: 22px; padding: 22px 18px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    border: 1px solid var(--line);
  }
  .arab {
    font-family: 'Amiri', 'Noto Naskh Arabic', 'Geeza Pro', 'Traditional Arabic', 'Scheherazade New', serif;
    font-size: clamp(1.9rem, 8.5vw, 2.5rem); line-height: 1.7; text-align: center; margin: 0;
    direction: rtl;
  }
  .latin { margin: 0; font-weight: 700; color: var(--accent); text-align: center; font-size: .98rem; }
  .arti { margin: 0; color: var(--muted); text-align: center; font-size: .88rem; line-height: 1.45; }

  .tap-wrap { position: relative; width: min(74vw, 280px); aspect-ratio: 1; margin: 6px 0 2px; }
  .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 9; }
  .ring .track { stroke: var(--accent-soft); }
  .ring .bar { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset .18s ease-out; }
  .tap {
    position: absolute; inset: 15px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--accent); color: var(--on-accent);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font: inherit; user-select: none; -webkit-user-select: none; touch-action: manipulation;
    transition: transform .08s ease;
  }
  .tap:active { transform: scale(.965); }
  .tap:focus-visible, .btn:focus-visible, .chip:focus-visible, .tab:focus-visible {
    outline: 3px solid var(--gold); outline-offset: 3px;
  }
  .count { font-size: clamp(3.4rem, 18vw, 4.6rem); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .hint { font-size: .8rem; font-weight: 600; opacity: .85; }

  .status { min-height: 1.3em; margin: 0; font-size: .9rem; font-weight: 700; color: var(--muted); text-align: center; }
  .status.done { color: var(--gold); }

  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  .row-label { font-size: .82rem; color: var(--muted); font-weight: 700; margin-right: 2px; }
  .chip {
    border: 1.5px solid var(--line); background: transparent; color: var(--ink);
    font: inherit; font-weight: 700; font-size: .88rem;
    padding: 7px 14px; border-radius: 999px; cursor: pointer; min-width: 52px;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .actions { display: flex; gap: 10px; width: 100%; }
  .btn {
    flex: 1; border: 1.5px solid var(--line); background: transparent; color: var(--ink);
    font: inherit; font-weight: 700; font-size: .92rem; padding: 12px; border-radius: 14px; cursor: pointer;
  }
  .btn.danger.armed { background: #B3402E; border-color: #B3402E; color: #fff; }

  .foot { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .82rem; font-weight: 600; padding: 0 4px; }
  .toggle { background: none; border: 0; color: var(--muted); font: inherit; font-weight: 700; cursor: pointer; padding: 6px 4px; }

  .wm { margin: 2px 0 0; text-align: center; font-size: .72rem; font-weight: 600; color: var(--muted); opacity: .7; }

  @media (prefers-reduced-motion: reduce) {
    .ring .bar, .tap { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <h1>Penghitung Dzikir</h1>

  <div class="tabs" role="tablist" aria-label="Pilih dzikir">
    <button class="tab" role="tab" id="tab-0" aria-selected="true" data-i="0">Tasbih <small>Subhanallah</small></button>
    <button class="tab" role="tab" id="tab-1" aria-selected="false" data-i="1">Istighfar <small>Astaghfirullah</small></button>
  </div>

  <section class="card" aria-live="off">
    <p class="arab" id="arab" lang="ar"></p>
    <p class="latin" id="latin"></p>
    <p class="arti" id="arti"></p>

    <div class="tap-wrap">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="46"/>
        <circle class="bar" id="bar" cx="50" cy="50" r="46"/>
      </svg>
      <button class="tap" id="tap" aria-label="Tambah hitungan">
        <span class="count" id="count">0</span>
        <span class="hint">ketuk untuk menghitung</span>
      </button>
    </div>

    <p class="status" id="status" role="status"></p>

    <div class="row" role="group" aria-label="Target hitungan">
      <span class="row-label">Target</span>
      <button class="chip" data-t="33" aria-pressed="false">33</button>
      <button class="chip" data-t="99" aria-pressed="false">99</button>
      <button class="chip" data-t="100" aria-pressed="true">100</button>
      <button class="chip" data-t="0" aria-pressed="false">Bebas</button>
    </div>

    <div class="actions">
      <button class="btn" id="undo">Kurangi 1</button>
      <button class="btn danger" id="reset">Ulang dari 0</button>
    </div>
  </section>

  <div class="foot">
    <span id="total"></span>
    <button class="toggle" id="vib" aria-pressed="true">Getar: nyala</button>
  </div>
  <p class="wm">by Ummu Zahirah</p>
</main>

<script>
(function () {
  var DZIKR = [
    {
      arab: 'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ',
      latin: 'Subhanallahi wa bihamdih',
      arti: 'Maha Suci Allah dan segala puji bagi-Nya'
    },
    {
      arab: 'أَسْتَغْفِرُ اللَّهَ وَأَتُوْبُ إِلَيْهِ',
      latin: 'Astaghfirullaha wa atubu ilaih',
      arti: 'Aku memohon ampun kepada Allah dan bertaubat kepada-Nya'
    }
  ];

  var KEY = 'penghitung-dzikir-v1';
  var mem = null;
  var state = { active: 0, counts: [0, 0], targets: [100, 100], vibrate: true };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.counts) && s.counts.length === 2) {
          state.active = s.active === 1 ? 1 : 0;
          state.counts = [Math.max(0, s.counts[0] | 0), Math.max(0, s.counts[1] | 0)];
          if (Array.isArray(s.targets) && s.targets.length === 2) state.targets = [s.targets[0] | 0, s.targets[1] | 0];
          state.vibrate = s.vibrate !== false;
        }
      }
    } catch (e) { /* penyimpanan tidak tersedia; lanjut tanpa menyimpan */ }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  var $ = function (id) { return document.getElementById(id); };
  var bar = $('bar'), C = 2 * Math.PI * 46;
  bar.style.strokeDasharray = C;

  function buzz(ms) {
    if (state.vibrate && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
  }

  function render() {
    var i = state.active, d = DZIKR[i], n = state.counts[i], t = state.targets[i];

    $('arab').textContent = d.arab;
    $('latin').textContent = d.latin;
    $('arti').textContent = d.arti;
    $('count').textContent = n;

    document.querySelectorAll('.tab').forEach(function (el) {
      el.setAttribute('aria-selected', String(+el.dataset.i === i));
    });
    document.querySelectorAll('.chip').forEach(function (el) {
      el.setAttribute('aria-pressed', String(+el.dataset.t === t));
    });

    var frac = 0, status = '', done = false;
    if (t > 0) {
      var inRound = n % t;
      var rounds = Math.floor(n / t);
      frac = (n > 0 && inRound === 0) ? 1 : inRound / t;
      if (n === 0) status = 'Target ' + t + ' kali';
      else if (inRound === 0) { status = 'Target ' + t + ' tercapai' + (rounds > 1 ? ' (putaran ke-' + rounds + ')' : ''); done = true; }
      else status = inRound + ' dari ' + t + (rounds > 0 ? ' · putaran ke-' + (rounds + 1) : '');
    } else {
      status = n === 0 ? 'Tanpa target' : 'Tanpa target';
    }
    bar.style.strokeDashoffset = C * (1 - frac);
    var st = $('status');
    st.textContent = status;
    st.className = 'status' + (done ? ' done' : '');

    $('total').textContent = 'Total: ' + (state.counts[0] + state.counts[1]);
    var v = $('vib');
    v.textContent = 'Getar: ' + (state.vibrate ? 'nyala' : 'mati');
    v.setAttribute('aria-pressed', String(state.vibrate));
    document.title = n + ' · Penghitung Dzikir';
  }

  var resetTimer = null;
  function disarm() {
    var b = $('reset');
    b.classList.remove('armed');
    b.textContent = 'Ulang dari 0';
    clearTimeout(resetTimer);
  }

  $('tap').addEventListener('click', function () {
    var i = state.active;
    state.counts[i]++;
    var t = state.targets[i];
    if (t > 0 && state.counts[i] % t === 0) buzz([60, 60, 120]); else buzz(12);
    disarm(); save(); render();
  });

  $('undo').addEventListener('click', function () {
    var i = state.active;
    if (state.counts[i] > 0) state.counts[i]--;
    disarm(); save(); render();
  });

  $('reset').addEventListener('click', function () {
    var b = $('reset');
    if (!b.classList.contains('armed')) {
      b.classList.add('armed');
      b.textContent = 'Ketuk lagi untuk ulang';
      resetTimer = setTimeout(disarm, 3000);
      return;
    }
    state.counts[state.active] = 0;
    disarm(); save(); render();
  });

  document.querySelectorAll('.tab').forEach(function (el) {
    el.addEventListener('click', function () {
      state.active = +el.dataset.i;
      disarm(); save(); render();
    });
  });

  document.querySelectorAll('.chip').forEach(function (el) {
    el.addEventListener('click', function () {
      state.targets[state.active] = +el.dataset.t;
      save(); render();
    });
  });

  $('vib').addEventListener('click', function () {
    state.vibrate = !state.vibrate;
    if (state.vibrate) buzz(20);
    save(); render();
  });

  load();
  render();
})();
</script>
</body>
</html>
